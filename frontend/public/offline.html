<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#081014" />
<title>NeuroNexus · Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #081014; color: #d8f6f8;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 18px; }
  h1 { font-size: 18px; letter-spacing: 0.08em; color: #24e3ef; }
  button { margin-top: 12px; background: #0e2a30; color: #d8f6f8; border: 1px solid #24e3ef; border-radius: 6px;
    padding: 8px 16px; font: inherit; letter-spacing: 0.06em; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/pwa/icon-192.png" alt="NeuroNexus" />
  <h1>NO CONNECTION</h1>
  <p>The console reads NASA mission data from its server on every view, so it needs a connection. No cached values are shown offline.</p>
  <button type="button" onclick="location.reload()">RETRY</button>
</main>
</body>
</html>
