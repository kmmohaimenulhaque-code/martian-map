# Serves the built console and forwards API calls exactly like the Vite dev proxy:
#   /api/*      -> API with the /api prefix removed
#   /terrain/*  -> API unchanged (map tiles)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://backend:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # Mars Intelligence and USGS snapshots can take a while
    }

    location /terrain/ {
        proxy_pass http://backend:8002/terrain/;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
