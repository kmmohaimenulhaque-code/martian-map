name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-api.txt
            requirements-dev.txt
      - run: pip install -r deploy/requirements-api.txt -r requirements-dev.txt
      - name: Ruff (Marswalk-era modules)
        run: ruff check $(cat .github/ruff-paths.txt)
      - name: Ledger check
        run: if [ -f tools/build_ledger.py ]; then python tools/build_ledger.py --check; fi
      - name: Pytest (network tests skipped)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
